name: Build and publish desktop and Android releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (built locally)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-assets-${{ github.ref_name }}
          path: prebuilt-release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: prebuilt-release-assets/*.apk
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x86_64 bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kivy runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libgles2 libmtdev1 libx11-6 libxext6 \
            libxrender1 libxrandr2 libxcursor1 libxi6 libxinerama1 libxkbcommon0 xvfb xauth
      - name: Package Linux application
        id: build-linux
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          (set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          xvfb-run -a pyinstaller --noconfirm --clean --onedir --name PixelChess \
            --add-data "assets:assets" \
            --add-data "chess_app/ui/theme.kv:chess_app/ui" main.py
          cp packaging/linux/README.txt dist/README.txt
          cp packaging/linux/install.sh dist/install.sh
          chmod +x dist/install.sh
          mkdir -p Release
          version="${GITHUB_REF_NAME#v}"
          tar -czf "Release/PixelChess-${version}-linux-x86_64.tar.gz" -C dist PixelChess README.txt install.sh) 2>&1 | tee /tmp/linux-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 35 /tmp/linux-build.log | tr '\n' ' ' | cut -c1-4000)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Linux build details::$details"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: steps.build-linux.outcome == 'failure'
        with:
          name: linux-build-log
          path: /tmp/linux-build.log
          retention-days: 3
      - name: Stop if Linux build failed
        if: steps.build-linux.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: Release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows installer
    runs-on: windows-latest
    if: github.ref_name == 'v1.2.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Windows application
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --windowed --onedir --name PixelChess `
            --icon assets/pixelchess-icon.ico `
            --add-data "assets;assets" `
            --add-data "chess_app/ui/theme.kv;chess_app/ui" main.py
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $env:APP_VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path Release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" "/O$PWD\Release" packaging\windows\PixelChess.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Release/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [android, linux, windows]
    if: always() && needs.android.result == 'success' && needs.linux.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Pixel Chess ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**
          fail_on_unmatched_files: true
